[project]
name = "fast-dcp"
version = "0.1.0"
authors = [{name="Hiro Ito", email="mobiiii24@gmail.com"}]
description = "aliases docker compose command and arguments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
dcp = "fast_dcp:main"
dcpu = "fast_dcp:dcpu_main"
dcpe = "fast_dcp:dcpe_main"

[project.urls]
Repository = "https://github.com/HiroItozzz/fast-dcp"

[build-system]
requires = ["flit_core >= 3.12.0, <4"]
build-backend = "flit_core.buildapi"

[tool.uv]
package = true

[tool.ruff]
line-length=100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.src]
include= ["src/"]