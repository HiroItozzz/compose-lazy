[build-system]
requires = ["flit_core >= 3.12.0, <5"]
build-backend = "flit_core.buildapi"

[project]
name = "fast-dcp"
version = "0.5.3"
authors = [{ name = "Hiro Ito", email = "mobiiii24@gmail.com" }]
keywords = ["docker", "docker compose", "alias", "command line tool", "productivity"]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["description"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
dcp = "fast_dcp.main:main"
dcpu = "fast_dcp.main:dcpu_main"
dcpe = "fast_dcp.main:dcpe_main"

[project.urls]
Repository = "https://github.com/HiroItozzz/fast-dcp"
Issues = "https://github.com/HiroItozzz/fast-dcp/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.flit.sdist]
include = ["tests/"]

[tool.uv]
package = true

[tool.ruff]
line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.src]
include = ["src/"]
